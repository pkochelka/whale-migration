[project]
name = "whale-pipeline"
version = "0.1.0"
description = "Fetch, clean and unify whale occurrence data and environmental layers"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyobis>=1.4",
    "pygbif>=0.6.4",
    "pyworms>=0.2",
    "erddapy>=2.2",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "numpy>=1.26",
    "scipy>=1.17.1",
    "rasterio>=1.4.4",
    "networkx>=3.6.1",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
